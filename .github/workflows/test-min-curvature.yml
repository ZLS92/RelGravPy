name: Minimum-curvature interpolation tests

on:
  push:
    branches:
      - feature/min-curvature
    paths:
      - 'relgravpy/utils.py'
      - 'relgravpy/_min_curvature_core.py'
      - 'tests/test_min_curvature.py'
      - 'tests/test_min_curvature_robust.py'
      - 'tests/test_min_curvature_integration.py'
      - '.github/workflows/test-min-curvature.yml'
  pull_request:
    paths:
      - 'relgravpy/utils.py'
      - 'relgravpy/_min_curvature_core.py'
      - 'tests/test_min_curvature.py'
      - 'tests/test_min_curvature_robust.py'
      - 'tests/test_min_curvature_integration.py'
  workflow_dispatch:

jobs:
  validate-minimum-curvature:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python -m pip install numpy scipy pytest
      - name: Compile and check curvature sources
        run: |
          python -m py_compile relgravpy/utils.py
          python -m py_compile relgravpy/_min_curvature_core.py
      - name: Test interpolation, gridded gaps, padding and block preprocessing
        run: |
          PYTHONPATH=tests:. python -m pytest -v -s tests/test_min_curvature.py tests/test_min_curvature_robust.py tests/test_min_curvature_integration.py
