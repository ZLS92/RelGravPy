name: Spherical harmonics reference tests

on:
  push:
    paths:
      - 'relgravpy/sh_core.py'
      - 'tests/test_sh_core.py'
      - '.github/workflows/test-sh-core.yml'
  pull_request:
    paths:
      - 'relgravpy/sh_core.py'
      - 'tests/test_sh_core.py'
      - '.github/workflows/test-sh-core.yml'
  workflow_dispatch:

jobs:
  test-sh-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent SH test dependencies
        run: python -m pip install numpy pytest
      - name: Validate standalone SH kernel
        run: python -m pytest -q tests/test_sh_core.py
