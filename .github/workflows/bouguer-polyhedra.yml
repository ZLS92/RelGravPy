name: Bouguer spherical-polyhedron validation

on:
  push:
    branches:
      - feat/bouguer-polyhedral-curvature
    paths:
      - 'relgravpy/_bouguer_correction.py'
      - 'relgravpy/grav_modelling.py'
      - 'tests/test_bouguer_polyhedra.py'
      - 'tests/test_polygrav_nagy.py'
      - 'tests/benchmark_polygrav_nagy.py'
      - 'tests/benchmark_spherical_reference.py'
      - 'tests/benchmark_r1_transition.py'
      - 'tests/diagnose_r1_outer_seam.py'
      - '.github/workflows/bouguer-polyhedra.yml'
  pull_request:
    paths:
      - 'relgravpy/_bouguer_correction.py'
      - 'relgravpy/grav_modelling.py'
      - 'tests/test_bouguer_polyhedra.py'
      - 'tests/test_polygrav_nagy.py'
      - 'tests/benchmark_polygrav_nagy.py'
      - 'tests/benchmark_spherical_reference.py'
      - 'tests/benchmark_r1_transition.py'
      - 'tests/diagnose_r1_outer_seam.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python -m pip install numpy pytest
      - name: Compile numerical and Bouguer modules
        run: |
          python -m py_compile relgravpy/grav_modelling.py
          python -m py_compile relgravpy/_bouguer_correction.py
      - name: Validate unified Polygrav against Nagy and check geometry
        run: PYTHONPATH=tests:. python -m pytest -v tests/test_bouguer_polyhedra.py tests/test_polygrav_nagy.py
      - name: Quantify Polygrav-versus-Nagy error by size distance and density
        run: PYTHONPATH=tests:. python -u tests/benchmark_polygrav_nagy.py
      - name: Verify primary independent spherical reference and mesh convergence
        run: PYTHONPATH=tests:. python -u tests/benchmark_spherical_reference.py
      - name: Validate two-resolution R1 interface against spherical volume integral
        run: PYTHONPATH=tests:. python -u tests/benchmark_r1_transition.py
      - name: Diagnose outer seam compatibility after mesh adjustment
        run: PYTHONPATH=tests:. python -u tests/diagnose_r1_outer_seam.py
