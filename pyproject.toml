[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relgravpy"
version = "0.1.0"
description = "Relative gravimetry processing for geophysical applications"
authors = [
    { name = "Luigi Sante Zampa" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyproj",
    "contextily"
]

[tool.setuptools.package-data]
relgravpy = ["data/*.dat", "data/*.md", "data/*.txt"]

[project.optional-dependencies]
# Numba is deliberately NOT required by the base installation.
# Install with: pip install ".[fast]"
fast = ["numba>=0.59"]
