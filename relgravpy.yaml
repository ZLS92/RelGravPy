name: relgravpy
channels:
  - conda-forge

dependencies:
  - python>=3.10
  - numpy
  - scipy
  - pandas
  - matplotlib

  # Jupyter / notebook integration
  - ipykernel
  - matplotlib-inline
  - jupyterlab

  # Geospatial dependencies
  - gdal
  - proj
  - pyproj
  - shapely
  - pdf
  - pdfkit

  # Utility
  - pip

  # Install package via pip (editable or not)
  - pip:
      - -e .
