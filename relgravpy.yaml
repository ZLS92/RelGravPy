name: relgravpy
channels:
  - conda-forge

dependencies:
  - python>=3.10
  - numpy
  - scipy
  - pandas
  - matplotlib

  # Jupyter / notebook integration
  - ipykernel
  - matplotlib-inline
  # scegli UNO dei due (o entrambi se vuoi)
  - jupyterlab
  # - notebook

  # Geospatial dependencies
  - gdal
  - proj
  - pyproj
  - shapely

  # Utility
  - pip

  # Install package via pip (editable or not)
  - pip:
      - -e .
